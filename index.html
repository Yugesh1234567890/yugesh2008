<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0002;
    }

    .product img {
      width: 100%;
      border-radius: 8px;
    }

    button {
      background: #111;
      color: white;
      border: 0;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    #cart {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      text-align: right;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<header>
  <b>MiniShop</b>
  <span>🛒 Cart: <span id="count">0</span></span>
</header>

<main>
  <h2>Products</h2>

  <div class="products" id="products"></div>

  <div id="cart">
    <h2>Cart</h2>
    <div id="cartItems">Cart is empty.</div>
    <div class="total">
      Total: $<span id="total">0.00</span>
    </div>
    <button onclick="checkout()">Checkout</button>
  </div>
</main>

<script>
  const products = [
    {
      id: 1,
      name: "T-Shirt",
      price: 20,
      image: "https://via.placeholder.com/300x200?text=T-Shirt"
    },
    {
      id: 2,
      name: "Sneakers",
      price: 60,
      image: "https://via.placeholder.com/300x200?text=Sneakers"
    },
    {
      id: 3,
      name: "Backpack",
      price: 35,
      image: "https://via.placeholder.com/300x200?text=Backpack"
    },
    {
      id: 4,
      name: "Watch",
      price: 45,
      image: "https://via.placeholder.com/300x200?text=Watch"
    }
  ];

  let cart = [];

  function showProducts() {
    productsDiv.innerHTML = products.map(product => `
      <div class="product">
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>$${product.price}</p>
        <button onclick="addToCart(${product.id})">
          Add to Cart
        </button>
      </div>
    `).join("");
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const item = cart.find(p => p.id === id);

    if (item) {
      item.quantity++;
    } else {
      cart.push({ ...product, quantity: 1 });
    }

    showCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    showCart();
  }

  function showCart() {
    const items = document.getElementById("cartItems");

    if (cart.length === 0) {
      items.innerHTML = "Cart is empty.";
    } else {
      items.innerHTML = cart.map(item => `
        <div class="item">
          <span>${item.name} × ${item.quantity}</span>
          <span>
            $${item.price * item.quantity}
            <button onclick="removeFromCart(${item.id})">×</button>
          </span>
        </div>
      `).join("");
    }

    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    const total = cart.reduce(
      (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("count").textContent = count;
    document.getElementById("total").textContent = total.toFixed(2);
  }

  function checkout() {
    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    alert("Order placed successfully!");
    cart = [];
    showCart();
  }

  const productsDiv = document.getElementById("products");
  showProducts();
  showCart();
</script>

</body>
</html>
